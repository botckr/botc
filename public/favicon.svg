<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blood" x1="50" y1="40" x2="50" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  
  <!-- Stylized Clock Face (Minimalist) -->
  <circle cx="50" cy="45" r="28" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.3"/>
  <circle cx="50" cy="45" r="28" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 20" opacity="0.8"/>
  
  <!-- Clock Hands forming an ominous angle -->
  <path d="M50 45 L62 33" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 45 L42 60" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="50" cy="45" r="4" fill="#e2e8f0"/>

  <!-- Large Blood Drop overlapping the clock -->
  <path d="M50 40 C50 40 38 65 38 75 C38 81.627 43.373 87 50 87 C56.627 87 62 81.627 62 75 C62 65 50 40 50 40 Z" fill="url(#blood)" filter="url(#glow)"/>
</svg>